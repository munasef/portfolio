<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Post — Alexander Jarosch</title>
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/blog.css" />
</head>
<body>

  <nav class="blog-nav">
    <a href="../index.html" class="blog-nav-logo">AJ</a>
    <div class="blog-nav-links">
      <a href="../index.html#projects" class="blog-nav-link">Projects</a>
      <a href="../index.html#about"    class="blog-nav-link">About</a>
      <a href="../index.html#contact"  class="blog-nav-link">Contact</a>
    </div>
  </nav>

  <div class="blog-wrap" id="pageWrap">

    <div class="post-not-found" id="notFound" style="display:none">
      <p>Post not found. <a href="index.html">← Back to writing</a></p>
    </div>

    <article id="postArticle" style="display:none">
      <header class="post-header">
        <a href="index.html" class="post-back">← Writing</a>
        <h1 class="post-title" id="postTitle"></h1>
        <div class="post-meta">
          <span class="post-meta-item" id="postDate"></span>
          <span class="post-meta-sep">·</span>
          <span class="post-meta-item" id="postRead"></span>
        </div>
        <div class="post-tags" id="postTags" style="margin-top:14px"></div>
      </header>
      <div class="post-content" id="postContent"></div>
    </article>

  </div>

  <script src="../js/posts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const slug = new URLSearchParams(window.location.search).get('slug');
    const post = (typeof POSTS !== 'undefined') && POSTS.find(p => p.slug === slug);

    if (!post) {
      document.getElementById('notFound').style.display = '';
    } else {
      // Populate header
      document.title = post.title + ' — Alexander Jarosch';
      document.getElementById('pageTitle').textContent = post.title + ' — Alexander Jarosch';
      document.getElementById('postTitle').textContent = post.title;
      document.getElementById('postDate').textContent = new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('postRead').textContent = post.readTime || '';
      document.getElementById('postTags').innerHTML = (post.tags || []).map(t => `<span class="post-tag">${t}</span>`).join('');

      // Fetch and render markdown
      fetch('posts/' + slug + '.md')
        .then(r => {
          if (!r.ok) throw new Error('Not found');
          return r.text();
        })
        .then(md => {
          marked.setOptions({ breaks: true, gfm: true });
          document.getElementById('postContent').innerHTML = marked.parse(md);
          document.getElementById('postArticle').style.display = '';
        })
        .catch(() => {
          document.getElementById('notFound').style.display = '';
        });
    }
  </script>

</body>
</html>
