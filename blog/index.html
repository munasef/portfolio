<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing — Alexander Jarosch</title>
  <meta name="description" content="Technical breakdowns and pipeline notes by Alexander Jarosch, Lead FX TD." />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/blog.css" />
</head>
<body>

  <nav class="blog-nav">
    <a href="../index.html" class="blog-nav-logo">AJ</a>
    <div class="blog-nav-links">
      <a href="../index.html#projects" class="blog-nav-link">Projects</a>
      <a href="../index.html#about"    class="blog-nav-link">About</a>
      <a href="../index.html#contact"  class="blog-nav-link">Contact</a>
    </div>
  </nav>

  <div class="blog-wrap">

    <header class="blog-page-header">
      <p class="blog-page-label">Technical Writing</p>
      <h1 class="blog-page-title">Writing</h1>
      <p class="blog-page-sub">Pipeline notes, breakdowns, and things I figured out the hard way.</p>
    </header>

    <div class="post-list" id="postList"></div>

  </div>

  <script src="../js/posts.js"></script>
  <script>
    const list = document.getElementById('postList');

    if (!POSTS || POSTS.length === 0) {
      list.innerHTML = '<p style="color:var(--faint); padding: 40px 0;">No posts yet.</p>';
    } else {
      POSTS.forEach(post => {
        const date = new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        const tags = (post.tags || []).map(t => `<span class="post-tag">${t}</span>`).join('');

        list.innerHTML += `
          <a class="post-card" href="post.html?slug=${post.slug}">
            <div class="post-card-meta">
              <span class="post-card-date">${date}</span>
              <span class="post-card-read">${post.readTime || ''}</span>
            </div>
            <h2 class="post-card-title">${post.title}</h2>
            <p class="post-card-excerpt">${post.excerpt}</p>
            <div class="post-tags">${tags}</div>
          </a>`;
      });
    }
  </script>

</body>
</html>
